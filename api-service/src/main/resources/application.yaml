spring:
  application:
    name: datavortex-api

  datasource:
    # Το read-only επιβάλλεται από τον SERVER, όχι από τον driver: το "read-only" του pool και
    # το readOnlyMode του pgjdbc ισχύουν μόνο μέσα σε ρητό transaction, άρα με autocommit οι
    # εγγραφές περνούσαν κανονικά (το βρήκε το integration test). Με default_transaction_read_only
    # στη σύνδεση, κάθε απόπειρα εγγραφής από αυτό το service απορρίπτεται από την Postgres.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bigdata_db}?options=-c%20default_transaction_read_only%3Don
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      # Read-only: κανένα query δεν πρέπει να γράψει, και κανένα δεν πρέπει να κρεμάσει
      read-only: true
      connection-init-sql: SET statement_timeout = '10s'

server:
  port: ${API_PORT:8082}
  # Συμπίεση: οι απαντήσεις είναι JSON με πολλές επαναλαμβανόμενες λέξεις
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

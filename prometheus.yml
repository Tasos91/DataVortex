global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Το host.docker.internal δείχνει στο localhost του υπολογιστή σου (εκεί που τρέχει η Java)
      - targets: ['host.docker.internal:8080']
global:
  scrape_interval: 5s

# Τι θεωρούμε πρόβλημα, γραμμένο ως κανόνας αντί για προφορική συμφωνία.
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  # Τα τρία services της εφαρμογής. Το host.docker.internal δείχνει στο localhost του
  # υπολογιστή σου (εκεί που τρέχουν τα Java services). Όσα δεν τρέχουν φαίνονται απλώς DOWN.
  - job_name: 'datavortex'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels: { service: 'ingestion' }
      - targets: ['host.docker.internal:8082']
        labels: { service: 'api' }
      - targets: ['host.docker.internal:8085']
        labels: { service: 'analytics-ui' }
version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL (Βάση Δεδομένων)
  # ----------------------------------------------------
  postgres:
    image: postgres:15
    container_name: thesis-postgres
    ports:
      - "5432:5432" # Το port που ορισες στο application.yml
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bigdata_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - thesis-net

  # ----------------------------------------------------
  # 2. Apache Kafka (KRaft mode - Χωρίς Zookeeper)
  # ----------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: thesis-kafka
    ports:
      - "9092:9092" # Για να συνδέεται το Spring Boot από το localhost
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # Μπορείς να βάλεις οποιοδήποτε Base64 string 22 χαρακτήρων
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Κανένα topic δεν δημιουργείται σιωπηλά: ο broker θα το έφτιαχνε με 1 partition,
      # που σημαίνει μηδενικό παραλληλισμό στον consumer. Τα topics τα φτιάχνει η εφαρμογή.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    networks:
      - thesis-net

  # ----------------------------------------------------
  # 3. Schema Registry (για το Protobuf schema των μηνυμάτων)
  # ----------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: thesis-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081" # Συνδέεται ακριβώς με το SCHEMA_REGISTRY_URL σου
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
    networks:
      - thesis-net

  # ----------------------------------------------------
  # 4. Prometheus (Για τα metrics του Actuator που έβαλες)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: thesis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml # Απαιτεί ένα μικρό αρχειάκι
    networks:
      - thesis-net

  # ----------------------------------------------------
  # 5. Grafana (Για να βλέπεις οπτικά τα δεδομένα σου)
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: thesis-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Κωδικός για το UI
    networks:
      - thesis-net

networks:
  thesis-net:
    driver: bridge

volumes:
  pgdata:
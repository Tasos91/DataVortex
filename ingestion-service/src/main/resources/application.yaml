  spring:
    # Virtual threads: η εισαγωγή περιμένει σε Kafka και βάση, όχι σε CPU.
    threads:
      virtual:
        enabled: true

    application:
      name: data-vortex

    # Ανέβασμα CSV: τα defaults του Spring είναι 1MB αρχείο / 10MB request, δηλαδή σχεδόν κάθε
    # αληθινό CSV θα απορριπτόταν. Το αρχείο διαβάζεται σε ροή και πάνω από το threshold ζει στον
    # δίσκο, όχι στη μνήμη, άρα το μεγάλο όριο δεν κινδυνεύει να ρίξει τη διεργασία.
    servlet:
      multipart:
        max-file-size: ${MAX_UPLOAD_FILE_SIZE:2GB}
        max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:2GB}
        file-size-threshold: 256KB

    # ----------------------------------------------------
    # 1. Βάση Δεδομένων (PostgreSQL)
    # ----------------------------------------------------
    datasource:
      # reWriteBatchedInserts: ο driver ενώνει τα batched inserts σε ένα statement
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bigdata_db}?reWriteBatchedInserts=true
      username: ${DB_USER:postgres}
      password: ${DB_PASS:postgres}
      hikari:
        # Ένα connection ανά consumer thread (concurrency) και ένα για το Flyway/υπόλοιπα
        maximum-pool-size: ${DB_POOL_SIZE:8} # ένα ανά consumer thread, συν εφεδρεία

    # Το schema το φτιάχνει το Flyway (db/migration), ΟΧΙ το Hibernate: ο πίνακας είναι
    # TimescaleDB hypertable με συμπίεση, πράγματα που το ddl-auto δεν ξέρει να φτιάξει
    # και θα τα χαλούσε.
    flyway:
      enabled: true
      baseline-on-migrate: true
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: false

    # ----------------------------------------------------
    # 2. Ρυθμίσεις Spring Cloud Stream (Για τον Consumer)
    # ----------------------------------------------------
    cloud:
      function:
        # Δηλώνουμε μόνο το consumeData, καθώς ο Producer είναι KafkaTemplate
        definition: consumeData

      stream:
        kafka:
          binder:
            brokers: ${KAFKA_BROKERS:localhost:9092}
            auto-create-topics: false

            consumer-properties:
              key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
              # Ο ErrorHandlingDeserializer "τυλίγει" τον Protobuf deserializer: ένα χαλασμένο
              # μήνυμα δεν ρίχνει τον consumer, γίνεται null + header με το σφάλμα και πάει στο DLQ.
              value.deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
              spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
              schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
              specific.protobuf.value.type: com.thesis.kafkacollector.proto.IngestedRecordProto$IngestedRecord
              # Μεγαλύτερα batches: ο broker περιμένει να μαζέψει 64KB ή 500ms. Με fetch.min.bytes=1
              # τα batches έβγαιναν ~45 μηνύματα, που σημαίνει πολλά μικρά inserts στη βάση.
              fetch.min.bytes: ${KAFKA_FETCH_MIN_BYTES:65536}
              fetch.max.wait.ms: ${KAFKA_FETCH_MAX_WAIT_MS:500}
              max.poll.records: ${KAFKA_MAX_POLL_RECORDS:500}   # μέγεθος batch ανά poll
              # Πόσο γρήγορα ο consumer ανακαλύπτει νέα topics του pattern. Από 30s σε 5s: μέχρι την
              # ανακάλυψη, ο παραγωγός περιμένει (δες KafkaTopicService.awaitConsumerAssignment),
              # άρα τα 30s ήταν 30s καθυστέρηση στην πρώτη εισαγωγή κάθε νέας πηγής.
              metadata.max.age.ms: ${KAFKA_METADATA_MAX_AGE_MS:5000}

          bindings:
            consumeData-in-0:
              consumer:
                destination-is-pattern: true  # το destination παραπάνω είναι regex

        # ----------------------------------------------------
        # 3. Bindings: Εδώ ικανοποιείς την απαίτηση του Καθηγητή
        # ----------------------------------------------------
        bindings:
          # Consumer (Ανάγνωση από Kafka -> DB)
          consumeData-in-0:
            # Pattern, όχι ένα topic: ο χρήστης ορίζει topic ανά request και ο consumer
            # τα πιάνει όλα όσα ταιριάζουν (δες destination-is-pattern πιο κάτω).
            destination: '${KAFKA_TOPIC_PATTERN:ingest\..*}'
            group: ${CONSUMER_GROUP:default-ingestion-group}
            consumer:
              startOffset: earliest # <-- Αυτό ξυπνάει το earliest στο Cloud Stream
              useNativeDecoding: true
              batch-mode: true      # List<...> ανά poll, ώστε να γίνονται batch inserts
              # Όσα και τα partitions: η εγγραφή στη βάση είναι αναμονή I/O, όχι CPU, άρα
              # περισσότερα threads γράφουν παράλληλα χωρίς να μαλώνουν για τους 4 πυρήνες.
              concurrency: ${CONSUMER_CONCURRENCY:6}

    # ----------------------------------------------------
    # 4. Standard Kafka Properties (Για Producer & @KafkaListener Consumer)
    # ----------------------------------------------------
    kafka:
      bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        # ΔΙΟΡΘΩΣΗ: Στέλνουμε Bytes, ΟΧΙ String! (Αυτό έφταιγε για το SerializationException)
        value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

        # --- ΠΡΟΣΘΗΚΕΣ & ΑΛΛΑΓΕΣ ΓΙΑ BIG DATA STREAMING ---
        compression-type: lz4                                # Σώζει bandwidth, ιδανικό για JSON/CSV
        batch-size: ${KAFKA_BATCH_SIZE:65536}                # Αλλάξαμε το default από 16384 (16KB) σε 65536 (64KB)
        # ΜΙΚΡΟΣ buffer επίτηδες. Με 64MB χωρούσαν ~250.000 μηνύματα σε αναμονή: δεχόμασταν πολύ
        # περισσότερα απ' όσα προλάβαινε να γράψει ο broker, και μετά από 2 λεπτά αναμονής το
        # delivery.timeout.ms τα ΑΚΥΡΩΝΕ ("Expiring 2 record(s)... 120001 ms has passed").
        # Με 16MB το send() μπλοκάρει νωρίς, ο αναγνώστης επιβραδύνεται στον ρυθμό του broker,
        # και δεν χάνεται τίποτα: το μπλοκάρισμα ΕΙΝΑΙ το backpressure.
        buffer-memory: ${KAFKA_BUFFER_MEMORY:16777216}       # 16MB
        properties:
          schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
          # Πόσο περιμένει το send() όταν ο buffer είναι γεμάτος. Γενναιόδωρο επίτηδες: εδώ η
          # αναμονή είναι το ζητούμενο (backpressure), όχι σφάλμα. Ο νεκρός broker πιάνεται
          # νωρίτερα από τον έλεγχο ύπαρξης topic, που απαντά 400/503 σε λίγα χιλιοστά.
          max.block.ms: ${KAFKA_MAX_BLOCK_MS:60000}
          linger.ms: ${KAFKA_LINGER_MS:5}                    # Αλλάξαμε το 0 σε 5ms για να προλαβαίνει να γεμίσει το batch

      consumer:
        group-id: ${CONSUMER_GROUP:thesis-group-v3}
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # ΔΙΟΡΘΩΣΗ: Deserializer (Διαβάζει), όχι Serializer!
        value-deserializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer

      # Το custom property που διαβάζει ο FileStreamingService & ο Consumer
      topic:
        ingestion: ${KAFKA_TOPIC:ingest.default}      # default topic όταν το request δεν ορίζει δικό του
        default-partitions: ${KAFKA_TOPIC_PARTITIONS:6} # partitions για topic που φτιάχνει η εφαρμογή
        replication-factor: ${KAFKA_TOPIC_REPLICATION:1}
        cache-ttl-ms: ${KAFKA_TOPIC_CACHE_TTL_MS:30000}  # πόσο κρατάει η cache "το topic υπάρχει"
        consumer-pattern: '${KAFKA_TOPIC_PATTERN:ingest\..*}' # ίδιο με το destination του consumer
        dlq: ${KAFKA_DLQ_TOPIC:dlq.ingest}               # εκτός pattern, για να μην ξαναδιαβάζεται

  # ----------------------------------------------------
  # 5. Monitoring (Prometheus Metrics & Actuator)
  # ----------------------------------------------------
  # Δικές μας ρυθμίσεις (όχι του Spring)
  datavortex:
    # Πόσες γραμμές ανά INSERT statement. Το batch του Kafka (max.poll.records) κόβεται
    # σε κομμάτια αυτού του μεγέθους· 9 στήλες x 1000 = 9000 παράμετροι, άνετα κάτω από
    # το όριο των 65535 παραμέτρων του Postgres.
    batch-rows: ${DB_BATCH_ROWS:1000}
    # Πόσα ταυτόχρονα ingest requests επιτρέπονται. Πιο πολλά σημαίνει ότι γεμίζει το buffer
    # του producer και μπλοκάρουν όλα τα Tomcat threads· τα επιπλέον παίρνουν 429.
    max-concurrent-ingests: ${MAX_CONCURRENT_INGESTS:4}

  management:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus,metrics,loggers
    endpoint:
      prometheus:
        enabled: true
      health:
        show-details: always
    metrics:
      export:
        prometheus:
          enabled: true
      # Ιστογράμματα μόνο όπου θέλουμε p99 (κάθε ιστόγραμμα κοστίζει σε μνήμη και σε bytes
      # προς το Prometheus, γι' αυτό δεν τα ανοίγουμε για όλα).
      distribution:
        percentiles-histogram:
          http.server.requests: true
          datavortex.db.insert: true
          datavortex.ingest.flush: true
    prometheus:
      metrics:
        export:
          enabled: true

  server:
    port: 8080
    compression:
      enabled: true
      mime-types: application/json,text/html
      min-response-size: 1024
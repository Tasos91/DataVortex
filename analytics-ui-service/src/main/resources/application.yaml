spring:
  web:
    resources:
      cache:
        cachecontrol:
          # Τα στατικά (ECharts 1 MB) δεν αλλάζουν μεταξύ φορτώσεων: ο browser να τα κρατά.
          max-age: 7d
          cache-public: true

  # Virtual threads (Java 21): κάθε request περιμένει σε δίκτυο ή βάση, όχι σε CPU. Έτσι λίγοι
  # πυρήνες εξυπηρετούν πολλά ταυτόχρονα requests χωρίς να δεσμεύεται ένα βαρύ thread ανά request.
  threads:
    virtual:
      enabled: true

  application:
    name: datavortex-analytics-ui

datavortex:
  # Πού ζει το api-service. Το UI δεν ξέρει τίποτα για τη βάση.
  api-base-url: ${API_BASE_URL:http://localhost:8082}

server:
  port: ${UI_PORT:8085}
  compression:
    enabled: true
    # ΠΡΟΣΟΧΗ στο text/javascript: ο Tomcat σερβίρει τα .js ως text/javascript (σύγχρονο
    # πρότυπο), άρα η λίστα με μόνο application/javascript ΔΕΝ έπιανε, και το ECharts
    # κατέβαινε ασυμπίεστο — 1 MB αντί για ~330 KB.
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # Οι λεπτομέρειες είναι το νόημα: "UP" χωρίς να λες ποιες εξαρτήσεις απαντούν δεν βοηθά.
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

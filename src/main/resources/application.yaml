  spring:
    application:
      name: data-vortex

    # ----------------------------------------------------
    # 1. Βάση Δεδομένων (PostgreSQL)
    # ----------------------------------------------------
    datasource:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bigdata_db}
      username: ${DB_USER:postgres}
      password: ${DB_PASS:postgres}
    jpa:
      hibernate:
        ddl-auto: update # Ή 'validate' σε production
      show-sql: false

    # ----------------------------------------------------
    # 2. Ρυθμίσεις Spring Cloud Stream (Για τον Consumer)
    # ----------------------------------------------------
    cloud:
      function:
        # Δηλώνουμε μόνο το consumeData, καθώς ο Producer είναι KafkaTemplate
        definition: consumeData

      stream:
        kafka:
          binder:
            brokers: ${KAFKA_BROKERS:localhost:9092}
            auto-create-topics: false

            consumer-properties:
              key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
              # ΔΙΟΡΘΩΣΗ: Πρέπει να διαβάζει Bytes (Protobuf), ΟΧΙ String!
              value.deserializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
              schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
              specific.protobuf.value.type: com.thesis.kafkacollector.proto.IngestedRecordProto$IngestedRecord
              fetch.min.bytes: ${KAFKA_FETCH_MIN_BYTES:1}

        # ----------------------------------------------------
        # 3. Bindings: Εδώ ικανοποιείς την απαίτηση του Καθηγητή
        # ----------------------------------------------------
        bindings:
          # Consumer (Ανάγνωση από Kafka -> DB)
          consumeData-in-0:
            destination: ${KAFKA_TOPIC:ais-data} # Κοινό Topic!
            group: ${CONSUMER_GROUP:default-ingestion-group}
            consumer:
              startOffset: earliest # <-- Αυτό ξυπνάει το earliest στο Cloud Stream
              useNativeDecoding: true
              concurrency: ${CONSUMER_CONCURRENCY:1}

    # ----------------------------------------------------
    # 4. Standard Kafka Properties (Για Producer & @KafkaListener Consumer)
    # ----------------------------------------------------
    kafka:
      bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        # ΔΙΟΡΘΩΣΗ: Στέλνουμε Bytes, ΟΧΙ String! (Αυτό έφταιγε για το SerializationException)
        value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

        # --- ΠΡΟΣΘΗΚΕΣ & ΑΛΛΑΓΕΣ ΓΙΑ BIG DATA STREAMING ---
        compression-type: lz4                                # Σώζει bandwidth, ιδανικό για JSON/CSV
        batch-size: ${KAFKA_BATCH_SIZE:65536}                # Αλλάξαμε το default από 16384 (16KB) σε 65536 (64KB)
        buffer-memory: ${KAFKA_BUFFER_MEMORY:67108864}       # 64MB (προστατεύει από OutOfMemory αν το Kafka καθυστερεί)
        properties:
          schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
          linger.ms: ${KAFKA_LINGER_MS:5}                    # Αλλάξαμε το 0 σε 5ms για να προλαβαίνει να γεμίσει το batch

      consumer:
        group-id: ${CONSUMER_GROUP:thesis-group-v3}
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        # ΔΙΟΡΘΩΣΗ: Deserializer (Διαβάζει), όχι Serializer!
        value-deserializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer

      # Το custom property που διαβάζει ο FileStreamingService & ο Consumer
      topic:
        ingestion: ${KAFKA_TOPIC:ais-data}

  # ----------------------------------------------------
  # 5. Monitoring (Prometheus Metrics & Actuator)
  # ----------------------------------------------------
  management:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus,metrics
    endpoint:
      prometheus:
        enabled: true
    metrics:
      export:
        prometheus:
          enabled: true

  server:
    port: 8080
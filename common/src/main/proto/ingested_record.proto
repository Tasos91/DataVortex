syntax = "proto3";

import "google/protobuf/struct.proto";

option java_package = "com.thesis.kafkacollector.proto";
option java_outer_classname = "IngestedRecordProto";

message IngestedRecord {
  string sourceId = 1;
  string payloadJson = 2; // Κρατάμε το raw json string όπως το είχες

  // Τα 3 και 4 ήταν lat/lon (πεδία-παράδειγμα). Δεσμεύονται ώστε να μην ξαναχρησιμοποιηθεί
  // ο ίδιος αριθμός για νέο πεδίο με άλλη σημασία: παλιά μηνύματα στο Kafka μπορεί να τα
  // έχουν ακόμα, και ο αριθμός είναι η μόνη ταυτότητα ενός πεδίου στο Protobuf.
  reserved 3, 4;

  // Δυναμικά πεδία: το όνομα και η διαδρομή (JSONPath) ορίζονται από τον χρήστη μέσα στο
  // request, π.χ. "EthPrice": "$.ethusdt.max"  ->  fields["EthPrice"] = 10000.0
  // Το google.protobuf.Value κρατά τον τύπο (αριθμός / κείμενο / boolean / null / object / list).
  // ΟΛΑ τα πεδία του χρήστη ζουν εδώ· κανένα δεν έχει ξεχωριστή μεταχείριση.
  map<string, google.protobuf.Value> fields = 5;
}
